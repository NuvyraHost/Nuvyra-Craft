<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvyra-Craft Splash</title>
    <style>
        /* Base Reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0a0a12;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: absolute;
            width: 350px; height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: ambientPulse 3s ease-in-out infinite;
        }

        @keyframes ambientPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            will-change: opacity, transform;
            position: relative;
            z-index: 2;
        }

        /* Logo Animation */
        .logo {
            opacity: 0;
            transform: scale(0.85);
            animation: logoEnter 700ms cubic-bezier(0.2, 0, 0, 1) 600ms forwards;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px rgba(34, 197, 94, 0.15);
        }

        /* Tagline Animation */
        .tagline {
            margin-top: 16px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #64748b;
            opacity: 0;
            animation: taglineEnter 800ms ease-out 1000ms forwards;
        }

        /* Loading dots */
        .loading-dots {
            margin-top: 24px;
            display: flex;
            gap: 6px;
            opacity: 0;
            animation: taglineEnter 500ms ease-out 1400ms forwards;
        }
        .loading-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes logoEnter {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes taglineEnter {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo"><img src="../assets/logo.png" alt="Nuvyra-Craft Logo" class="logo-img"></div>
        <div class="tagline">Best Minecraft Server Manager</div>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    
    <script>
        // No heavy JS here. 
        // The main process will fade out this window and close it after ~2.5s.
    </script>
</body>
</html>
